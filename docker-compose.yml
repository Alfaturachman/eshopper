version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eshopper_web
    restart: always
    ports:
      - "8080:80"
    environment:
      - ENVIRONMENT=production
    volumes:
      - ./uploads:/var/www/html/uploads
      - ./application/logs:/var/www/html/application/logs
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: eshopper_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: eshopper
      MYSQL_USER: eshopper_user
      MYSQL_PASSWORD: eshopper_pass
    ports:
      - "33066:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
